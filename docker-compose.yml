version: '3.8'

services:
  logspectra-ui:
    build: .
    ports:
      - "${PORT:-3050}:3050"
    environment:
      - NODE_ENV=production
      - PORT=3050
      - LOGSPECTRA_API_URL=${LOGSPECTRA_API_URL:-http://host.docker.internal:8081}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8081}
    container_name: logspectra-ui
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3050', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
