# Pushes to the existing Docker Hub repo: logspectra/logspectra-ui
# Does not create a new Hub repository — only updates tags on main.
name: Publish Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # Secrets live in GitHub Environment "logspectra" (or repo-level Actions secrets)
    environment: logspectra
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            logspectra/logspectra-ui:latest
            logspectra/logspectra-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
